<!DOCTYPE html>
<html>
<head>
<title>Money Clicker</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1b5e20;
    font-family: Arial, sans-serif;
}

/* HARD COVER – hides Scratch bar */
#top-cover {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 140px; /* IMPORTANT */
    background: #1b5e20;
    z-index: 9999;
}

/* MARQUEE */
marquee {
    margin-top: 40px;
    font-size: 36px;
    font-weight: bold;
    color: white;
    background: #2e7d32;
    padding: 10px 0;
}

/* BUTTONS */
#buttons {
    margin-top: 10px;
    padding-left: 10px;
}

button {
    background: #0f3d0f;
    color: white;
    border: none;
    padding: 8px 16px;
    margin-right: 8px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

/* GAME */
#game {
    position: absolute;
    top: 140px;
    left: 0;
    width: 100%;
    height: calc(100vh - 140px);
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* POPUPS */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 10000;
    justify-content: center;
    align-items: center;
}

.popup-box {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    text-align: center;
}

    display: flex;
    justify-content: space-between;
