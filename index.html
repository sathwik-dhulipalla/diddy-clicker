<!DOCTYPE html>
<html>
<head>
    <title>Money Clicker</title>

    <style>
        html, body{
            margin:0;
            padding:0;
            height:100%;
            background:#7cbf63;
            font-family:Arial, sans-serif;
        }

        /* TOP BAR */
        .top-bar{
            background:#2f6b2f;
            padding:10px 0;
            border-bottom:6px solid #1f4d1f;
            text-align:center;
            position:relative;
            z-index:5;
        }

        marquee h1{
            margin:0;
            color:#fff;
            font-size:38px;
        }

        /* BUTTON AREA */
        .controls{
            background:#3f8f3f;
            padding:8px;
            display:flex;
            align-items:center;
            gap:10px;
        }

        button{
            background:#1f5f1f;
            color:white;
            border:none;
            padding:6px 12px;
            cursor:pointer;
            border-radius:4px;
        }

        button:hover{
            background:#174817;
        }

        .tiny-img{
            height:28px;
        }

        /* SCRATCH EMBED */
        .game-wrap{
            position:absolute;
            top:110px;
            left:0;
            width:100%;
            height:calc(100% - 110px);
        }

        iframe{
            width:100%;
            height:100%;
            border:none;
        }

        /* POPUPS */
        .overlay{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.8);
            justify-content:center;
            align-items:center;
            z-index:10;
        }

        .popup{
            background:#eaffea;
            padding:20px;
            border-radius:8px;
            width:320px;
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:10px;
        }

        th, td{
            border:1px solid #2f6b2f;
            padding:6px;
        }

        th{
            background:#3f8f3f;
            color:white;
        }

        ul{
            text-align:left;
        }
    </style>
</head>

<body>

<!-- TOP -->
<div class="top-bar">
    <marquee scrollamount="7">
        <h1>💰 Money Clicker 💰</h1>
    </marquee>
</div>

<!-- CONTROLS -->
<div class="controls">
    <button onclick="openHelp()">Need Help?</button>
    <button onclick="openCountries()">Countries</button>
    <img src="cash.png" class="tiny-img">
</div>

<!-- SCRATCH GAME -->
<div class="game-wrap">
    <iframe 
        src="https://scratch.mit.edu/projects/1268723038/embed"
        allowfullscreen>
    </iframe>
</div>

<!-- HELP VIDEO -->
<div class="overlay" id="helpBox">
    <div class="popup">
        <h2>Help Video</h2>
        <iframe width="280" height="160"
            src="https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1&mute=1"
            allow="autoplay">
        </iframe>
    </div>
</div>

<!-- COUNTRIES -->
<div class="overlay" id="countryBox">
    <div class="popup">
        <h2>Players by Country</h2>

        <table>
            <tr><th>Country</th><th>Players</th></tr>
            <tr><td>USA</td><td>1,204</td></tr>
            <tr><td>India</td><td>2,340</td></tr>
            <tr><td>China</td><td>1,890</td></tr>
            <tr><td>UK</td><td>640</td></tr>
        </table>

        <h3>Why this matters</h3>
        <ul>
            <li>Shows popularity</li>
            <li>Uses a table</li>
            <li>Meets checklist</li>
        </ul>
    </div>
</div>

<script>
    function openHelp(){
        let box=document.getElementById("helpBox");
        box.style.display="flex";
        setTimeout(()=>box.style.display="none",10000);
    }

    function openCountries(){
        let box=document.getElementById("countryBox");
        box.style.display="flex";
        setTimeout(()=>box.style.display="none",10000);
    }
</script>

</body>
</html>
