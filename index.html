<!DOCTYPE html>
<html>
<head>
    <title>Baby Oil Clicker</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #b8824a;
            font-family: Arial, sans-serif;
        }

        marquee {
            background: #a66a32;
            color: #3a1f0d;
            padding: 8px 0;
            border-bottom: 6px solid #6b3e1e;
        }

        marquee h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 900;
        }

        .top-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            background: #c8965f;
            z-index: 2;
        }

        .help-btn {
            position: absolute;
            top: 44px;
            left: 10px;
            background: #6b3e1e;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 5;
        }

        .iframe-wrapper {
            position: absolute;
            top: 38px;
            left: 0;
            width: 100%;
            height: calc(100% - 38px);
            overflow: hidden;
        }

        .responsive-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #youtube-container {
            display: none;
            position: absolute;
            top: 38px;
            left: 0;
            width: 100%;
            height: calc(100% - 38px);
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #youtube-container iframe {
            width: 80%;
            height: 45%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="top-cover">
    <marquee scrollamount="8">
        <h1>Baby Oil Clicker</h1>
    </marquee>
</div>

<button class="help-btn" onclick="showYouTube()">Do you need help?</button>

<div class="iframe-wrapper">
    <iframe
            class="responsive-iframe"
            src="https://scratch.mit.edu/projects/1268723038/embed"
            scrolling="no"
            allowfullscreen>
    </iframe>
</div>

<div id="youtube-container">
    <iframe id="youtube-video"
            src=""
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
    </iframe>
</div>

<script>
    function showYouTube() {
        const container = document.getElementById('youtube-container');
        const iframe = document.getElementById('youtube-video');

        
        const videoID = "Aq5WXmQQooo"; // Rickroll
    
        iframe.src = `https://www.youtube.com/embed/${videoID}?autoplay=1&mute=1`;

        container.style.display = 'flex';

    
        setTimeout(() => {
            iframe.src = ""; // stop video
            container.style.display = 'none';
        }, 13000);
    }
</script>

</body>
</html>
