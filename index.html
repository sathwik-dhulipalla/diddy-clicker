<!DOCTYPE html>
<html>
<head>
<title>Money Clicker</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#2e7d32;
}

/* TOP BAR */
.topbar{
    background:#1b5e20;
    color:white;
    text-align:center;
    padding:15px;
    font-size:30px;
    font-weight:bold;
}

/* BUTTONS */
.btn{
    background:#2e7d32;
    color:white;
    border:none;
    padding:8px 14px;
    margin:5px;
    cursor:pointer;
    border-radius:5px;
    font-weight:bold;
}

.btn:hover{
    background:#1b5e20;
}

/* BUTTON AREA */
.button-area{
    padding:10px;
}

/* GAME AREA */
.game-box{
    width:100%;
    height:calc(100vh - 140px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* POPUPS */
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
}

.popup-box{
    background:white;
    padding:20px;
    width:300px;
    text-align:center;
    border-radius:10px;
}
</style>
</head>

<body>

<div class="topbar">
💰 Money Clicker 💰
</div>

<div class="button-area">
    <button class="btn" onclick="showLeaderboard()">Leaderboard</button>
    <button class="btn" onclick="showHelp()">Do you need help?</button>
</div>

<div class="game-box">
    <iframe src="https://scratch.mit.edu/projects/1268723038/embed"></iframe>
</div>

<!-- LEADERBOARD -->
<div class="popup" id="leaderboard">
    <div class="popup-box">
        <h2>💰 Leaderboard</h2>
        <p>John – 3409 Infinity</p>
        <p>Mark – 2046 Infinity</p>
        <p>Amy – 1095 Infinity</p>
        <p>Ishaan – 358 Infinity</p>
        <p>Arya – 200 Infinity</p>
    </div>
</div>

<!-- HELP -->
<div class="popup" id="helpBox">
    <div class="popup-box">
        <h2>Help</h2>
        <p>Click the money to earn more.</p>
        <p>Buy upgrades inside the game.</p>
        <p>Try to reach infinity!</p>
    </div>
</div>

<script>
function showLeaderboard(){
    let box = document.getElementById("leaderboard");
    box.style.display = "flex";

    setTimeout(()=>{
        box.style.display = "none";
    },10000);
}

function showHelp(){
    let box = document.getElementById("helpBox");
    box.style.display = "flex";

    setTimeout(()=>{
        box.style.display = "none";
    },10000);
}
</script>

</body>
</html>
