<!DOCTYPE HTML>
<html>
<head>
    <title>Diddy Clicker</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #b8824a;
            font-family: Arial, sans-serif;
        }

        marquee {
            background: #a66a32;
            color: #3a1f0d;
            padding: 8px 0;
            border-bottom: 6px solid #6b3e1e;
        }

        marquee h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 900;
        }

        .top-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 38px;
            background: #c8965f;
            z-index: 2;
        }

        .help-btn {
            position: absolute;
            top: 44px; /* just below top-cover */
            left: 10px;
            background: #6b3e1e;
            color: #fff;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 5;
        }

        .iframe-wrapper {
            position: absolute;
            top: 38px; /* below top-cover */
            left: 0;
            width: 100%;
            height: calc(100% - 38px);
            overflow: hidden; /* hides Scratch top bar */
        }

        .responsive-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Rickroll overlay */
        #rickroll-container {
            display: none;
            position: absolute;
            top: 38px; /* below top-cover */
            left: 0;
            width: 100%;
            height: calc(100% - 38px);
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #rickroll-container video {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="top-cover">
    <marquee scrollamount="8">
        <h1>DIDDY CLICKER</h1>
    </marquee>
</div>

<!-- Help button -->
<button class="help-btn" onclick="showRickroll()">Do you need help?</button>

<div class="iframe-wrapper">
    <iframe
        class="responsive-iframe"
        src="https://scratch.mit.edu/projects/1268723038/embed"
        scrolling="no"
        allowfullscreen>
    </iframe>
</div>

<!-- Rickroll overlay -->
<div id="rickroll-container">
   <video id="rickroll-video" autoplay muted playsinline>
    <source src="https://archive.org/download/RickAstleyNeverGonnaGiveYouUp_201808/RickAstley-NeverGonnaGiveYouUp.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
</video>
</div>

<script>
function showRickroll() {
    const container = document.getElementById('rickroll-container');
    const video = document.getElementById('rickroll-video');

    container.style.display = 'flex';
    video.currentTime = 0;
    video.play();

    // Hide after ~13 seconds
    setTimeout(() => {
        video.pause();
        container.style.display = 'none';
    }, 13000);
}
</script>

</body>
</html>
