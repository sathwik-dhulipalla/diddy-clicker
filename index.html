<!DOCTYPE html>
<html>
<head>
<title>Money Clicker</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#2e7d32;
}

.topbar{
    background:#1b5e20;
    color:white;
    text-align:center;
    padding:15px;
    font-size:30px;
    font-weight:bold;
}

.button-area{
    padding:10px;
}

.btn{
    background:#2e7d32;
    color:white;
    border:none;
    padding:8px 14px;
    margin:5px;
    cursor:pointer;
    border-radius:5px;
    font-weight:bold;
}

.btn:hover{
    background:#1b5e20;
}

.game-box{
    width:100%;
    height:calc(100vh - 140px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* POPUPS */
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
    z-index:10;
}

.popup-box{
    background:white;
    padding:20px;
    width:320px;
    text-align:center;
    border-radius:10px;
}

.popup-box h2{
    margin-top:0;
    border-bottom:2px solid #333;
    padding-bottom:5px;
}

.leader-row{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ccc;
    padding:4px 0;
}
</style>
</head>

<body>

<div class="topbar">💰 Money Clicker 💰</div>

<div class="button-area">
    <button class="btn" onclick="showLeaderboard()">Leaderboard</button>
    <button class="btn" onclick="showHelp()">Do you need help?</button>
</div>

<div class="game-box">
    <iframe src="https://scratch.mit.edu/projects/1268723038/embed"></iframe>
</div>

<!-- LEADERBOARD -->
<div class="popup" id="leaderboard">
    <div class="popup-box">
        <h2>💰 Leaderboard</h2>
        <div class="leader-row"><span>John</span><span>3409 ∞</span></div>
        <div class="leader-row"><span>Mark</span><span>2046 ∞</span></div>
        <div class="leader-row"><span>Amy</span><span>1095 ∞</span></div>
        <div class="leader-row"><span>Ishaan</span><span>358 ∞</span></div>
        <div class="leader-row"><span>Arya</span><span>200 ∞</span></div>
    </div>
</div>

<!-- HELP / RICKROLL -->
<div class="popup" id="helpBox">
    <div class="popup-box">
        <iframe width="100%" height="200"
        src=""
        id="yt"
        allow="autoplay"
        allowfullscreen></iframe>
    </div>
</div>

<script>
function showLeaderboard(){
    let box = document.getElementById("leaderboard");
    box.style.display = "flex";

    setTimeout(()=>{
        box.style.display = "none";
    },10000);
}

function showHelp(){
    let box = document.getElementById("helpBox");
    let vid = document.getElementById("yt");

    vid.src = "https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1";
    box.style.display = "flex";

    setTimeout(()=>{
        vid.src = "";
        box.style.display = "none";
    },10000);
}
</script>

</body>
</html>
