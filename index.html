<!DOCTYPE html>
<html>
<head>
<title>Money Clicker</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#1f7a1f;
}

/* TOP BAR */
.topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:90px;
    background:#1b5e20;
    color:white;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    line-height:90px;
    z-index:5;
}

/* BUTTONS */
.controls{
    position:fixed;
    top:90px;
    left:0;
    width:100%;
    background:#2e7d32;
    padding:8px;
    z-index:5;
}

.btn{
    background:#1b5e20;
    color:white;
    border:none;
    padding:8px 14px;
    margin-right:8px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#145214;
}

/* GAME */
.game-area{
    position:absolute;
    top:150px;
    left:0;
    width:100%;
    height:calc(100vh - 150px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* POPUPS */
.popup{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
    z-index:10;
    justify-content:center;
    align-items:center;
}

.popup-box{
    background:white;
    padding:20px;
    width:320px;
    border-radius:10px;
    text-align:center;
}

.popup-box h2{
    margin-top:0;
    border-bottom:2px solid #333;
    padding-bottom:5px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:4px 0;
    border-bottom:1px solid #ccc;
}
</style>
</head>

<body>

<div class="topbar">💰 MONEY CLICKER 💰</div>

<div class="controls">
    <button class="btn" onclick="showLeaderboard()">Leaderboard</button>
    <button class="btn" onclick="showHelp()">Need Help?</button>
</div>

<div class="game-area">
    <iframe src="https://scratch.mit.edu/projects/1268723038/embed"></iframe>
</div>

<!-- LEADERBOARD -->
<div class="popup" id="leaderboard">
    <div class="popup-box">
        <h2>Leaderboard</h2>
        <div class="row"><span>John</span><span>3409 ∞</span></div>
        <div class="row"><span>Mark</span><span>2046 ∞</span></div>
        <div class="row"><span>Amy</span><span>1095 ∞</span></div>
        <div class="row"><span>Ishaan</span><span>358 ∞</span></div>
        <div class="row"><span>Arya</span><span>200 ∞</span></div>
    </div>
</div>

<!-- HELP -->
<div class="popup" id="helpBox">
    <div class="popup-box">
        <iframe id="yt"
            width="100%"
            height="200"
            src=""
            allow="autoplay"
            allowfullscreen>
        </iframe>
    </div>
</div>

<script>
function showLeaderboard(){
    let box = document.getElementById("leaderboard");
    box.style.display = "flex";
    setTimeout(()=>box.style.display="none",10000);
}

function showHelp(){
    let box = document.getElementById("helpBox");
    let vid = document.getElementById("yt");

    vid.src = "https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1";
    box.style.display = "flex";

    setTimeout(()=>{
        vid.src = "";
        box.style.display = "none";
    },10000);
}
</script>

</body>
</html>
