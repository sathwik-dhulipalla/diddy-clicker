<!DOCTYPE html>
<html>
<head>
<title>Money Clicker</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1f7a1f;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* BIG HARD COVER */
#scratch-cover {
    position: fixed;
    top: 0;
    left: 0;
    height: 160px; /* THIS is the key */
    width: 100%;
    background: #145214;
    z-index: 9999;
}

/* MARQUEE */
marquee {
    margin-top: 30px;
    background: #2e8b2e;
    color: white;
    font-size: 36px;
    font-weight: 900;
    padding: 10px 0;
}

/* BUTTONS */
#buttons {
    margin-top: 8px;
    padding-left: 10px;
}

button {
    background: #0f3d0f;
    color: white;
    border: none;
    padding: 8px 14px;
    margin-right: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0b2c0b;
}

/* GAME */
#game {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

iframe {
    position: absolute;
    top: -120px; /* PUSH SCRATCH UP */
    width: 100%;
    height: calc(100% + 120px);
    border: none;
}

/* POPUPS */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 10000;
    justify-content: center;
    align-items: center;
}

.popup-box {
    background: white;
    padding: 20px;
    width: 320px;
    border-radius: 10px;
    text-align: center;
}

.row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #ccc;
    padding: 6px 0;
}
</style>
</head>

<body>

<div id="scratch-cover">
    <marquee>💰 MONEY CLICKER 💰 MONEY CLICKER 💰 MONEY CLICKER 💰</marquee>
    <div id="buttons">
        <button onclick="openLeaderboard()">Leaderboard</button>
        <button onclick="openHelp()">Need Help?</button>
    </div>
</div>

<div id="game">
    <iframe src="https://scratch.mit.edu/projects/1268723038/embed"></iframe>
</div>

<!-- LEADERBOARD -->
<div class="popup" id="leaderboard">
    <div class="popup-box">
        <h2>💰 Money Leaderboard</h2>
        <div class="row"><span>John</span><span>3409 ∞</span></div>
        <div class="row"><span>Mark</span><span>2046 ∞</span></div>
        <div class="row"><span>Amy</span><span>1095 ∞</span></div>
        <div class="row"><span>Ishaan</span><span>358 ∞</span></div>
        <div class="row"><span>Arya</span><span>200 ∞</span></div>
    </div>
</div>

<!-- HELP -->
<div class="popup" id="help">
    <div class="popup-box">
        <iframe id="yt" width="100%" height="200" allow="autoplay"></iframe>
    </div>
</div>

<script>
function openLeaderboard() {
    const l = document.getElementById("leaderboard");
    l.style.display = "flex";
    setTimeout(() => l.style.display = "none", 10000);
}

function openHelp() {
    const h = document.getElementById("help");
    const y = document.getElementById("yt");
    y.src = "https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1";
    h.style.display = "flex";
    setTimeout(() => {
        y.src = "";
        h.style.display = "none";
    }, 10000);
}
</script>

</body>
</html>
