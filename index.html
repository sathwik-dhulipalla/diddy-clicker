<!DOCTYPE html>
<html>
<head>
<title>Money Clicker</title>

<style>
html, body{
    margin:0;
    padding:0;
    height:100%;
    background:#2e7d32;
    font-family:Arial, sans-serif;
}

/* TOP COVER */
.top-cover{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:120px;
    background:#1b5e20;
    z-index:10;
}

/* MARQUEE */
marquee{
    margin-top:10px;
    background:#2e7d32;
    color:white;
    padding:10px 0;
}

h1{margin:0;font-size:36px}
h2{margin-top:10px}

/* BUTTONS */
.buttons{
    margin:10px;
}

button{
    background:#0f3d0f;
    color:white;
    border:none;
    padding:6px 12px;
    margin-right:6px;
    border-radius:4px;
    cursor:pointer;
}

/* IMAGE */
.image-box{
    margin-top:120px;
    text-align:center;
}

.image-box img{
    width:150px;
}

/* GAME */
.game{
    position:absolute;
    top:260px;
    left:0;
    width:100%;
    height:calc(100vh - 260px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

/* POPUPS */
.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
    z-index:20;
}

.box{
    background:white;
    padding:15px;
    width:320px;
    border-radius:8px;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

td, th{
    border:1px solid #000;
    padding:5px;
    text-align:center;
}
</style>
</head>

<body>

<div class="top-cover">
    <marquee><h1>💰 MONEY CLICKER 💰</h1></marquee>

    <div class="buttons">
        <button onclick="showHelp()">Need Help?</button>
        <button onclick="showCountries()">Countries</button>
    </div>
</div>

<!-- IMAGE -->
<div class="image-box">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5e/Money_icon.png">
    <h2>Click to get rich</h2>
</div>

<!-- GAME -->
<div class="game">
    <iframe src="https://scratch.mit.edu/projects/1268723038/embed"></iframe>
</div>

<!-- HELP (YT VIDEO ONLY) -->
<div class="popup" id="help">
    <div class="box">
        <iframe width="100%" height="200"
        src="https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1"
        allow="autoplay"></iframe>

        <ul>
            <li>Click to earn money</li>
            <li>Buy upgrades</li>
            <li>Reach infinity</li>
        </ul>
    </div>
</div>

<!-- COUNTRIES (TABLE) -->
<div class="popup" id="countries">
    <div class="box">
        <h2>Players by Country</h2>
        <table>
            <tr><th>Country</th><th>Players</th></tr>
            <tr><td>China</td><td>5,230</td></tr>
            <tr><td>India</td><td>4,180</td></tr>
            <tr><td>USA</td><td>3,760</td></tr>
            <tr><td>UK</td><td>1,420</td></tr>
        </table>
    </div>
</div>

<script>
function showHelp(){
    let h=document.getElementById("help");
    h.style.display="flex";
    setTimeout(()=>h.style.display="none",10000);
}

function showCountries(){
    let c=document.getElementById("countries");
    c.style.display="flex";
    setTimeout(()=>c.style.display="none",10000);
}
</script>

</body>
</html>
