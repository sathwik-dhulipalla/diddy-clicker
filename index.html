<!DOCTYPE html>
<html>
<head>
    <title>Money Clicker</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #4caf50;
            font-family: Arial, sans-serif;
        }

        /* TOP BAR */
        .top-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #2e7d32;
            z-index: 2;
        }

        marquee {
            color: #eaffea;
            padding: 6px 0;
            border-bottom: 6px solid #1b5e20;
        }

        marquee h1 {
            margin: 0;
            font-size: 36px;
        }

        /* BUTTONS */
        .btn {
            position: absolute;
            left: 10px;
            background: #1b5e20;
            color: white;
            border: none;
            padding: 7px 14px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 5;
        }

        .leaderboard-btn { top: 50px; }
        .help-btn { top: 90px; }

        .btn:hover {
            background: #145214;
        }

        /* GAME */
        .iframe-wrapper {
            position: absolute;
            top: 40px;
            width: 100%;
            height: calc(100% - 40px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* POPUPS */
        .popup {
            display: none;
            position: absolute;
            top: 40px;
            left: 0;
            width: 100%;
            height: calc(100% - 40px);
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }

        .popup-box {
            background: #2e7d32;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .popup h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="top-cover">
    <marquee scrollamount="8">
        <h1>💰 Money Clicker 💰</h1>
    </marquee>
</div>

<button class="btn leaderboard-btn" onclick="showLeaderboard()">Leaderboard</button>
<button class="btn help-btn" onclick="showHelp()">Do you need help?</button>

<div class="iframe-wrapper">
    <iframe src="https://scratch.mit.edu/projects/1268723038/embed"></iframe>
</div>

<!-- LEADERBOARD -->
<div id="leaderboard" class="popup">
    <div class="popup-box">
        <h2>💸 Infinity Money</h2>
        <p>John – 3409 Infinity</p>
        <p>Mark – 2046 Infinity</p>
        <p>Amy – 1095 Infinity</p>
        <p>Ishaan – 358 Infinity</p>
        <p>Arya – 200 Infinity</p>
    </div>
</div>
