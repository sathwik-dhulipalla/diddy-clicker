<!DOCTYPE HTML>
<html>
<head>
    <title>Diddy Clicker</title>

    <style>
        html, body {
             margin: 0;
             padding: 0;
             height: 100%;
             width: 100%;
             background: #b8824a;
             font-family: Arial, sans-serif;
         }

         marquee {
             background: #a66a32;
             color: #3a1f0d;
             padding: 8px 0;
             border-bottom: 6px solid #6b3e1e;
         }

         marquee h1 {
             margin: 0;
             font-size: 40px;
             font-weight: 900;
         }

         .top-cover {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 38px;
             background: #c8965f;
             z-index: 2;
         }

         .responsive-iframe {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             border: none;
         }

         .iframe-wrapper {
             position: absolute;
             top: 0;
             left: 0;
             width: 100%;
             height: 100%;
             overflow: hidden;
         }

    </style>
</head>

<body>


<div class="container">
    <div class="top-cover">

        <marquee scrollamount="8">
            <h1>DIDDY CLICKER</h1>
        </marquee>

    </div>

    <iframe
            class="responsive-iframe"
            src="https://scratch.mit.edu/projects/1268723038/embed"
            scrolling="no"
            allowfullscreen>
    </iframe>
</div>

</body>
</html>
